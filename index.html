<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion 导航</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 引入 SortableJS -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <!-- 字体图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="https://img.openocean.de5.net/img/2026/02/navigation (1).png">
    <style>
        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }

        .sidebar-active {
            background-color: #374151;
            border-right: 3px solid #f59e0b;
        }
    </style>
</head>

<body class="bg-gray-100 h-screen flex overflow-hidden text-sm">
    <div id="app" class="flex w-full h-full">

        <!-- 左侧侧边栏 -->
        <div class="w-64 bg-gray-900 text-gray-300 flex flex-col flex-shrink-0 transition-all duration-300">
            <!-- Logo -->
            <div
                class="h-16 flex items-center justify-center font-bold text-2xl text-yellow-500 tracking-wider border-b border-gray-800">
                <i class="fa-solid fa-compass mr-2"></i> LION
            </div>

            <!-- 分类列表 -->
            <div id="category-list" class="flex-1 overflow-y-auto py-4">
                <div v-for="cat in data.categories" :key="cat.id" :data-id="cat.id" @click="scrollToCat(cat.id)"
                    class="px-6 py-3 cursor-pointer hover:bg-gray-800 flex items-center justify-between group">
                    <div class="flex items-center">
                        <div v-if="isAdmin" class="mr-2 cursor-move text-gray-600 hover:text-gray-400 category-handle"
                            @click.stop>
                            <i class="fa-solid fa-grip-vertical"></i>
                        </div>
                        <div class="w-6 h-6 flex-shrink-0 mr-2 flex items-center justify-center overflow-hidden">
                            <img v-if="cat.icon && cat.icon.startsWith('http')" :src="cat.icon"
                                class="w-full h-full object-contain" onerror="this.style.display='none'">
                            <span v-else class="text-center">{{ cat.icon }}</span>
                        </div>
                        <span>{{ cat.name }}</span>
                    </div>
                    <!-- 编辑模式下的操作按钮 -->
                    <div v-if="isAdmin"
                        class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button @click.stop="openEditCatModal(cat)" class="text-blue-400 hover:text-blue-500">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button @click.stop="deleteCategory(cat.id)" class="text-red-500 hover:text-red-600">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>

                <!-- 添加分类按钮 -->
                <div v-if="isAdmin" @click="openAddCatModal"
                    class="px-6 py-3 cursor-pointer hover:bg-gray-800 text-yellow-500 text-center border-t border-gray-800 mt-2">
                    <i class="fa-solid fa-plus"></i> 添加分类
                </div>
            </div>

            <!-- 底部登录/退出 -->
            <div class="p-4 border-t border-gray-800 text-center">
                <button v-if="!isAdmin" @click="showLoginModal=true"
                    class="text-xs text-gray-500 hover:text-white">管理登录</button>
                <button v-else @click="logout" class="text-xs text-red-400 hover:text-red-300">退出管理</button>
            </div>
        </div>

        <!-- 右侧内容区 -->
        <div class="flex-1 flex flex-col h-full bg-gray-50">
            <!-- 顶部栏 -->
            <div class="h-16 bg-white shadow-sm flex items-center px-6 justify-between flex-shrink-0 z-10">
                <div class="text-gray-500"><i class="fa-solid fa-bars cursor-pointer"></i></div>
                <div class="flex items-center gap-4">
                    <a href="https://github.com" target="_blank" class="text-gray-500 hover:text-black"><i
                            class="fa-brands fa-github"></i> GitHub</a>
                </div>
            </div>

            <!-- 网站卡片区域 -->
            <div id="main-content" class="flex-1 overflow-y-auto p-6 scroll-smooth">

                <div v-for="cat in data.categories" :key="cat.id" :id="'cat-'+cat.id" class="mb-10">
                    <!-- 分类标题 -->
                    <div
                        class="flex items-center mb-4 text-gray-700 text-lg font-medium border-l-4 border-transparent pl-2 hover:border-yellow-500 transition-colors">
                        <div class="w-6 h-6 flex-shrink-0 mr-2 flex items-center justify-center overflow-hidden">
                            <img v-if="cat.icon && cat.icon.startsWith('http')" :src="cat.icon"
                                class="w-full h-full object-contain" onerror="this.style.display='none'">
                            <span v-else>{{ cat.icon }}</span>
                        </div>
                        {{ cat.name }}
                        <button v-if="isAdmin" @click="openAddItemModal(cat.id)"
                            class="ml-4 text-xs bg-yellow-500 text-white px-2 py-1 rounded hover:bg-yellow-600">
                            <i class="fa-solid fa-plus"></i> 添加网站
                        </button>
                    </div>

                    <!-- 卡片网格 -->
                    <div :id="'item-grid-' + cat.id"
                        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 item-grid"
                        :data-catid="cat.id">
                        <div v-for="item in getItemsByCat(cat.id)" :key="item.id" :data-id="item.id"
                            class="bg-white p-4 rounded-lg shadow-sm hover:shadow-md transition-shadow group relative border border-gray-100 flex items-start">

                            <div v-if="isAdmin"
                                class="absolute left-1 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-opacity cursor-move text-gray-300 item-handle px-1"
                                @click.stop>
                                <i class="fa-solid fa-grip-vertical"></i>
                            </div>

                            <!-- 操作按钮 -->
                            <div v-if="isAdmin"
                                class="absolute top-2 right-2 flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button @click="openEditItemModal(item)" class="text-gray-400 hover:text-blue-500">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button @click="deleteItem(item.id)" class="text-gray-300 hover:text-red-500">
                                    <i class="fa-solid fa-times-circle"></i>
                                </button>
                            </div>

                            <!-- 图标 -->
                            <div
                                class="w-10 h-10 flex-shrink-0 mr-3 rounded-full overflow-hidden bg-gray-50 flex items-center justify-center">
                                <img v-if="item.icon.startsWith('http')" :src="item.icon"
                                    class="w-full h-full object-cover" onerror="this.style.display='none'">
                                <span v-else class="text-xl">{{ item.icon || '🔗' }}</span>
                            </div>

                            <!-- 内容 -->
                            <div class="flex-1 min-w-0">
                                <a :href="item.url" target="_blank"
                                    class="block font-bold text-gray-800 truncate hover:text-yellow-600 mb-1">
                                    {{ item.title }}
                                </a>
                                <p class="text-gray-400 text-xs line-clamp-2 h-8" :title="item.desc">{{ item.desc }}</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- 弹窗组件们 -->
        <!-- 1. 登录弹窗 -->
        <div v-if="showLoginModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white p-6 rounded shadow-lg w-80">
                <h3 class="font-bold mb-4">管理员登录</h3>
                <input v-model="passwordInput" type="password" placeholder="输入密码"
                    class="w-full border p-2 rounded mb-4">
                <div class="flex justify-end gap-2">
                    <button @click="showLoginModal=false" class="px-3 py-1 text-gray-500">取消</button>
                    <button @click="login" class="px-3 py-1 bg-yellow-500 text-white rounded">确定</button>
                </div>
            </div>
        </div>

        <!-- 2. 分类弹窗 (添加/编辑) -->
        <div v-if="showCatModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white p-6 rounded shadow-lg w-80">
                <h3 class="font-bold mb-4">{{ isEditingCat ? '编辑分类' : '添加分类' }}</h3>
                <input v-model="newCat.name" placeholder="分类名称" class="w-full border p-2 rounded mb-2">
                <input v-model="newCat.icon" placeholder="图标 (Emoji 或 图标链接)" class="w-full border p-2 rounded mb-4">
                <div class="flex justify-end gap-2">
                    <button @click="showCatModal=false" class="px-3 py-1 text-gray-500">取消</button>
                    <button @click="saveCategory" class="px-3 py-1 bg-yellow-500 text-white rounded">
                        {{ isEditingCat ? '保存修改' : '添加' }}
                    </button>
                </div>
            </div>
        </div>

        <!-- 3. 网站弹窗 (添加/编辑) -->
        <div v-if="showItemModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white p-6 rounded shadow-lg w-96">
                <h3 class="font-bold mb-4">{{ isEditingItem ? '编辑网站' : '添加网站' }}</h3>
                <input v-model="newItem.title" placeholder="网站名称" class="w-full border p-2 rounded mb-2">
                <input v-model="newItem.url" placeholder="链接地址 (https://...)" class="w-full border p-2 rounded mb-2">
                <textarea v-model="newItem.desc" placeholder="描述" class="w-full border p-2 rounded mb-2"></textarea>
                <input v-model="newItem.icon" placeholder="图标链接 或 Emoji" class="w-full border p-2 rounded mb-4">
                <div class="flex justify-end gap-2">
                    <button @click="showItemModal=false" :disabled="isSaving"
                        class="px-3 py-1 text-gray-500 disabled:opacity-50">取消</button>
                    <button @click="saveItem" :disabled="isSaving"
                        class="px-3 py-1 bg-yellow-500 text-white rounded flex items-center gap-2 disabled:opacity-50">
                        <i v-if="isSaving" class="fa-solid fa-spinner fa-spin"></i>
                        {{ isSaving ? (isEditingItem ? '保存中...' : '获取并保存中...') : (isEditingItem ? '保存修改' : '保存') }}
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, computed, onMounted, nextTick, watch } = Vue;

        createApp({
            setup() {
                const data = ref({ categories: [], items: [] });
                const isAdmin = ref(false);
                const passwordInput = ref('');
                const savedToken = localStorage.getItem('admin_token');
                if (savedToken) isAdmin.value = true;

                // 弹窗控制
                const showLoginModal = ref(false);
                const showCatModal = ref(false);
                const showItemModal = ref(false);
                const isEditingCat = ref(false);
                const isEditingItem = ref(false);

                // 表单数据
                const newCat = ref({ id: '', name: '', icon: '' });
                const newItem = ref({ id: '', categoryId: '', title: '', url: '', desc: '', icon: '' });
                const isSaving = ref(false);


                // 获取数据
                const fetchData = async () => {
                    try {
                        const res = await fetch('/api/data');
                        if (res.ok) {
                            data.value = await res.json();
                        } else {
                            const errData = await res.json().catch(() => ({}));
                            console.error('Fetch failed:', errData);
                            alert('无法加载数据: ' + (errData.error || res.statusText || res.status));
                        }
                    } catch (err) {
                        console.error('Fetch error:', err);
                        alert('网络错误，无法连接 API');
                    }
                };

                // 保存数据到 KV
                const saveData = async () => {
                    if (!isAdmin.value) return;
                    const res = await fetch('/api/data', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${savedToken || localStorage.getItem('admin_token')}`
                        },
                        body: JSON.stringify(data.value)
                    });
                    if (res.status === 401) {
                        alert('登录失效或密码错误');
                        logout();
                    } else if (!res.ok) {
                        let errorMessage = '';
                        try {
                            const errData = await res.json();
                            errorMessage = errData.error || errData.details || JSON.stringify(errData);
                        } catch (e) {
                            errorMessage = await res.text().catch(() => 'Unknown error');
                        }
                        alert('保存失败: ' + (errorMessage || res.statusText || res.status));
                    } else {
                        // alert('保存成功');
                    }
                };

                // 登录逻辑
                const login = () => {
                    // 这里只是简单的客户端保存，实际验证在保存数据时发生
                    localStorage.setItem('admin_token', passwordInput.value);
                    isAdmin.value = true;
                    showLoginModal.value = false;
                    passwordInput.value = '';
                };
                const logout = () => {
                    localStorage.removeItem('admin_token');
                    isAdmin.value = false;
                };

                // 业务逻辑
                const getItemsByCat = (catId) => data.value.items.filter(i => i.categoryId === catId);

                const openAddCatModal = () => {
                    isEditingCat.value = false;
                    newCat.value = { name: '', icon: '' };
                    showCatModal.value = true;
                };

                const openEditCatModal = (cat) => {
                    isEditingCat.value = true;
                    newCat.value = { ...cat };
                    showCatModal.value = true;
                };

                const saveCategory = () => {
                    if (isEditingCat.value) {
                        const index = data.value.categories.findIndex(c => c.id === newCat.value.id);
                        if (index !== -1) {
                            data.value.categories[index] = { ...newCat.value };
                        }
                    } else {
                        data.value.categories.push({
                            id: Date.now().toString(),
                            name: newCat.value.name,
                            icon: newCat.value.icon || '📁'
                        });
                    }
                    showCatModal.value = false;
                    saveData();
                };

                const deleteCategory = (id) => {
                    if (!confirm('确定删除该分类及其下所有网站吗？')) return;
                    data.value.categories = data.value.categories.filter(c => c.id !== id);
                    data.value.items = data.value.items.filter(i => i.categoryId !== id);
                    saveData();
                };

                const openAddItemModal = (catId) => {
                    isEditingItem.value = false;
                    newItem.value = { categoryId: catId, title: '', url: '', desc: '', icon: '' };
                    showItemModal.value = true;
                };

                const openEditItemModal = (item) => {
                    isEditingItem.value = true;
                    newItem.value = { ...item };
                    showItemModal.value = true;
                };

                const saveItem = async () => {
                    if (!newItem.value.title || !newItem.value.url) {
                        alert('请填写必要信息');
                        return;
                    }

                    isSaving.value = true;

                    try {
                        let finalIcon = newItem.value.icon;

                        // 如果图标链接为空，尝试抓取（仅在新增或链接改变且图标为空时）
                        if (!finalIcon && !isEditingItem.value) {
                            try {
                                const response = await fetch(`/api/favicon?url=${encodeURIComponent(newItem.value.url)}`);
                                if (response.ok) {
                                    const resData = await response.json();
                                    if (resData.icon) {
                                        finalIcon = resData.icon;
                                    }
                                }
                            } catch (e) {
                                console.error('抓取图标失败:', e);
                            }
                        }

                        // 确保至少有一个默认图标
                        if (!finalIcon) finalIcon = '🔗';

                        if (isEditingItem.value) {
                            const index = data.value.items.findIndex(i => i.id === newItem.value.id);
                            if (index !== -1) {
                                data.value.items[index] = { ...newItem.value, icon: finalIcon };
                            }
                        } else {
                            data.value.items.push({
                                id: Date.now().toString(),
                                ...newItem.value,
                                icon: finalIcon
                            });
                        }

                        await saveData();
                        showItemModal.value = false;
                    } catch (err) {
                        console.error('保存失败:', err);
                        alert('保存失败，请重试');
                    } finally {
                        isSaving.value = false;
                    }
                };

                const deleteItem = (id) => {
                    if (!confirm('确定删除此网站？')) return;
                    data.value.items = data.value.items.filter(i => i.id !== id);
                    saveData();
                };

                const scrollToCat = (id) => {
                    document.getElementById('cat-' + id).scrollIntoView({ behavior: 'smooth' });
                };

                // 初始化拖动排序
                let sortableInstances = [];
                const initSortable = () => {
                    if (!isAdmin.value) {
                        sortableInstances.forEach(s => s.destroy());
                        sortableInstances = [];
                        return;
                    }

                    nextTick(() => {
                        // 分类排序
                        const catList = document.getElementById('category-list');
                        if (catList) {
                            sortableInstances.push(new Sortable(catList, {
                                handle: '.category-handle',
                                animation: 150,
                                ghostClass: 'bg-gray-700',
                                onEnd: (evt) => {
                                    const newOrder = Array.from(catList.querySelectorAll('[data-id]'))
                                        .map(el => el.getAttribute('data-id'));
                                    const reordered = newOrder.map(id => data.value.categories.find(c => c.id === id)).filter(Boolean);
                                    data.value.categories = reordered;
                                    saveData();
                                }
                            }));
                        }

                        // 网站排序
                        document.querySelectorAll('.item-grid').forEach(el => {
                            const catId = el.getAttribute('data-catid');
                            sortableInstances.push(new Sortable(el, {
                                handle: '.item-handle',
                                animation: 150,
                                ghostClass: 'opacity-50',
                                onEnd: (evt) => {
                                    const newOrderIds = Array.from(el.querySelectorAll('[data-id]'))
                                        .map(child => child.getAttribute('data-id'));

                                    const otherItems = data.value.items.filter(i => i.categoryId !== catId);
                                    const catItems = data.value.items.filter(i => i.categoryId === catId);
                                    const reorderedCatItems = newOrderIds.map(id => catItems.find(i => i.id === id)).filter(Boolean);

                                    data.value.items = [...otherItems, ...reorderedCatItems];
                                    saveData();
                                }
                            }));
                        });
                    });
                };

                // 监听数据变化和管理员状态变化
                watch([isAdmin, () => data.value.categories.length, () => data.value.items.length], () => {
                    sortableInstances.forEach(s => s.destroy());
                    sortableInstances = [];
                    if (isAdmin.value) initSortable();
                });

                onMounted(async () => {
                    await fetchData();
                    if (isAdmin.value) initSortable();
                });

                return {
                    data, isAdmin, passwordInput, isSaving,
                    showLoginModal, showCatModal, showItemModal,
                    isEditingCat, isEditingItem,
                    newCat, newItem,
                    login, logout, getItemsByCat,
                    openAddCatModal, openEditCatModal, saveCategory, deleteCategory,
                    openAddItemModal, openEditItemModal, saveItem, deleteItem,
                    scrollToCat
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
